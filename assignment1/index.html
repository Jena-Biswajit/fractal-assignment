<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple 3 Column Layout</title>
    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f4f4f4;
        }

        header {
            background: #2c3e50;
            color: white;
            padding: 20px;
            text-align: center;
            font-size: 24px;
        }

        main {
            display: flex;
            gap: 15px;
            padding: 20px;
        }

        .column {
            flex: 1;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 5px rgba(0,0,0,0.1);
            text-align: center;
        }

        footer {
            background: #2c3e50;
            color: white;
            text-align: center;
            padding: 15px;
            position: fixed;
            bottom: 0;
            width: 100%;
        }
    </style>
</head>
<body>

<header>
    My Website Header
</header>

<main>
    <div class="column">Column 1 Content</div>
    <div class="column">Column 2 Content</div>
    <div class="column">Column 3 Content</div>
</main>

<footer>
    © 2026 My Website Footer
</footer>

</body>
</html>
