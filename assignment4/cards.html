<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Dynamic Cards</title>
    <style>
        body {
            font-family: Arial;
            background: #f2f2f2;
            padding: 30px;
        }

        h2 {
            text-align: center;
        }

        .card-container {
            display: flex;
            gap: 20px;
            justify-content: center;
            margin-top: 30px;
        }

        .card {
            background: white;
            width: 220px;
            padding: 15px;
            border-radius: 10px;
            box-shadow: 0 0 8px rgba(0,0,0,0.2);
            text-align: center;
        }

        .card img {
            width: 100%;
            height: 140px;
            object-fit: cover;
            border-radius: 8px;
        }

        .card h3 {
            margin: 10px 0 5px;
        }

        .card p {
            font-size: 14px;
            color: #555;
        }
    </style>
</head>
<body>

<h2>Dynamic Cards from JSON</h2>

<div class="card-container" id="cardContainer">
    <!-- Cards will be generated here -->
</div>

<script>
    // JSON data generated by ChatGPT
    var cardData = [
        {
            "title": "Java Programming",
            "description": "Learn core and advanced Java concepts.",
            "image": "https://via.placeholder.com/300x200?text=Java"
        },
        {
            "title": "Web Development",
            "description": "HTML, CSS, JavaScript complete guide.",
            "image": "https://via.placeholder.com/300x200?text=Web"
        },
        {
            "title": "Spring Boot",
            "description": "Build enterprise backend applications.",
            "image": "https://via.placeholder.com/300x200?text=Spring"
        }
    ];

    var container = document.getElementById("cardContainer");

    cardData.forEach(function(card) {
        var div = document.createElement("div");
        div.className = "card";

        div.innerHTML = `
            <img src="${card.image}">
            <h3>${card.title}</h3>
            <p>${card.description}</p>
        `;

        container.appendChild(div);
    });
</script>

</body>
</html>
